name: Update rankings

on:
  schedule:
    - cron: "0 12 * * 2"     # Tuesday: last week's stats are final
    - cron: "0 18 * * 4,5"   # Thu/Fri: injury reports start landing
    - cron: "0 14 * * 0"     # Sunday morning: last refresh before kickoff
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/run.py
      - name: Commit updated rankings
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/rankings.json
          git diff --cached --quiet || git commit -m "Update rankings"
          git push
